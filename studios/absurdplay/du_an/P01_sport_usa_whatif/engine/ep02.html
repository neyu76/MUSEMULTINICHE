  if(IN('s11',t)){for(let q=0;q<3;q++){const [a,b]=D3(q);if(t<a||t>=b)continue;const k=(t-a)/(b-a);const from=[new THREE.Vector3(RIM.x-3.4,0,1.4),new THREE.Vector3(RIM.x-3.2,0,-1.6),new THREE.Vector3(RIM.x-3.6,0,0.2)][q];

};

 const vp=new VelocityDepthNormalPass(s,cam);comp.addPass(vp);comp.addPass(new EffectPass(cam,new MotionBlurEffect(vp,{intensity:0.55,jitter:0,samples:8}),new ToneMappingEffect({mode:ToneMappingMode.NEUTRAL})));}
