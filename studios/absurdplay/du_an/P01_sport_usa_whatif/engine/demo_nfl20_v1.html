{const cb=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.33,0.015),std('#b07a3e'));const paper=new THREE.Mesh(new THREE.PlaneGeometry(0.2,0.26),std('#f6f6f2'));paper.position.z=0.009;cb.add(paper);
 COACH.bones.hand_l.add(cb);cb.position.set(0.0,0.12,0.06);cb.rotation.set(0.3,0,1.4);cb.scale.setScalar(1/COACH.root.scale.x);}
// 2 cầu thủ khoanh tay cạnh băng ghế (shot 8) và số 88 ngồi buồn (shot 10)

// cận mặt số 4 (shot 9)
const C4=add(makeCharacter(lib,{...COW,skin:'#8a5634',number:4,eyeScale:2.5,beard:true}),anim('Idle_FoldArms_Loop',0.2));C4.root.position.set(-30,0,-12);C4.root.rotation.y=Math.PI/2;
// em bé
const BABY=(o)=>({skin:'#f0c4a2',skinMix:1,jersey:'#f8a9c9',pants:'#ffffff',number:1,numberColor:'#ffffff',numberOutline:'#d23a4a',helmet:'#ffffff',helmetMetal:0.05,mask:'#ff7fb0',maskThick:0.14,maskBars:1,maskY:-0.12,toonHead:false,eyeScale:2.6,headRatio:1.9,
  smooth:{jersey:14,pants:10,socks:6,shoes:8,skin:6,head:10},puff:{jersey:0.06,pants:0.06,socks:0.035,shoes:0.03,skin:0.035,head:0,hand:0},...o});
const skins=['#f0c4a2','#9a6744','#ffe2cf','#c48a62','#7a4a2c','#e8b48e'];
let seed=11;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const babies=[];const poses=['sit','crawl','sit','lie','crawl','sit'];
for(let i=0;i<40;i++){const x=3+rnd()*22,z=-13+rnd()*26;if(Math.hypot(x-8,z+3)<2.2||Math.hypot(x-1.5,z-1)<2)continue;const sk=skins[i%skins.length];
  const b=makeBaby(lib,BABY({skin:sk,socks:sk,shoes:sk,number:[2,3,5,7,9,12,14,17,22,31,44][i%11],smooth:{jersey:8,pants:6,socks:4,shoes:4,skin:3,head:6}}));
  b.root.position.set(x,0,z);b.root.rotation.y=rnd()*6.28;const p=poses[i%poses.length],ph=rnd()*5;add(b,(ch,t)=>{POSES[p](ch,t+ph);groundIt(ch,0,0.03)},0.8);babies.push(b);}
// em bé số 23 ôm bóng (shot 5) và số 1 "starting QB" ngồi trên logo (shot 6)
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.1,32,16),std('#7a3b1c',{roughness:0.55}));ball.scale.set(1,1,1.55);s.add(ball);
{const lace=new THREE.Mesh(new THREE.BoxGeometry(0.012,0.006,0.12),std('#ffffff'));lace.position.y=0.098;ball.add(lace);for(let k=-2;k<=2;k++){const st=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.006,0.008),std('#ffffff'));st.position.set(0,0.099,k*0.022);ball.add(st);}}

B23.root.position.set(8,0,-3);B23.root.rotation.y=-Math.PI/2-0.5;
const ball2=ball.clone();s.add(ball2);
const B1=add(makeBaby(lib,BABY({skin:'#c48a62',socks:'#c48a62',shoes:'#c48a62',number:1})),(ch,t)=>{const p=sitHold(ch,t*0.7+1);ball2.position.copy(p);ball2.rotation.set(0.1,ch.root.rotation.y-0.4,0)},0.8);
B1.root.position.set(1.5,0,1.0);B1.root.rotation.y=-Math.PI/2+0.4;

// ---------- máy quay: 11 shot theo đúng mốc cắt của mẫu; chuyển động chậm như mẫu (trôi 2–8%/s, zoom 1–4%/s) ----------
const cam=new THREE.PerspectiveCamera(50,W/H,.05,600);
const rig=new CameraRig(cam,r.domElement,{seed:5});

// 9 (14.33–16.37) cận mặt số 4, máy hơi thấp

// 10 (16.37–18.77) số 88 ngồi buồn, băng rôn PLAYOFFS phía sau
S(16.37,18.77,{pos:[-5.2,1.3,22.9],look:[-5.6,1.45,26.5]},{pos:[-5.25,1.3,23.02],look:[-5.6,1.45,26.5]},{fov:[50,49]});

const DUTCH=[[14.33,16.37,-0.04],[18.77,20.9,0.09],[3.77,5.2,0.03]];
// ---------- hậu kỳ: motion blur theo vận tốc ----------
let comp;if(MB){comp=new EffectComposer(r,{frameBufferType:THREE.HalfFloatType,multisampling:2});comp.addPass(new RenderPass(s,cam));
 const vp=new VelocityDepthNormalPass(s,cam);comp.addPass(vp);comp.addPass(new EffectPass(cam,new MotionBlurEffect(vp,{intensity:0.5,jitter:0,samples:8}),new ToneMappingEffect({mode:ToneMappingMode.NEUTRAL})));}

  rig.apply(t);if(t>=14.33&&t<16.37){C4.mixer.setTime(t+0.2);C4.root.updateMatrixWorld(true);const h=C4.bones.Head.getWorldPosition(new THREE.Vector3());const k=(t-14.33)/2.04;cam.position.set(h.x+1.1-0.06*k,h.y-0.2,h.z+0.15+0.03*k);cam.lookAt(h.x,h.y-0.08,h.z);}
  for(const[a,b,z] of DUTCH)if(t>=a&&t<b)cam.rotateZ(z);
  cam.updateMatrixWorld();pm.multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse);fr.setFromProjectionMatrix(pm);
  for(const a of actors){a.ch.root.getWorldPosition(_v);_v.y+=0.8;const vis=fr.containsPoint(_v)||fr.intersectsSphere(new THREE.Sphere(_v,a.rad*1.6));a.ch.root.visible=vis&&_v.distanceTo(cam.position)<70;if(a.ch.root.visible)a.update(a.ch,t);}
  ball.visible=B23.root.visible;ball2.visible=B1.root.visible;
