<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}
/* Tập 4 — v0.6: dùng GÓI TRUYỀN HÌNH CỐ ĐỊNH (lib/goi_truyenhinh.js) như kênh mẫu; thẻ bật/tắt cứng theo shot; lóa trắng ở 6 nhịp.
   (bản v0.5 "tờ rơi bán xe" Anton + phóng/xoay đã bỏ — lệch bộ nhận diện của mẫu) */
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.wm{position:absolute;left:0;width:1080px;top:205px;text-align:center;font-family:Inter;font-weight:900;font-size:38px;letter-spacing:3px;color:rgba(255,255,255,.92);-webkit-text-stroke:5px rgba(0,0,0,.75);paint-order:stroke fill;text-shadow:0 2px 6px rgba(0,0,0,.35)}
</style></head><body>
<div class="wm" id="wm">AbsurdPlay</div>
<script type="module">
import {SH,SUB} from './ep04_shots.js';
import {TV} from './lib/goi_truyenhinh.js';
const RED='#D0021B';
const tv=TV({league:'NFL',teams:{A:{abbr:'PHI',color:'#004C54'},B:{abbr:'TUBE MEN',color:'#C8102E'}},sub:'NFL WEEK 10 · MEGA DEALS AUTO LOT'});
// thẻ (vị trí mặc định top 500; shot cận mặt dời lên 330)
tv.card('title',{head:'WEEK 10 · SUNDAY',value:'EAGLES vs 11 TUBE MEN'}).querySelector('.v').style.fontSize='64px';
tv.card('saq',{head:'STARTING RB',value:'BARKLEY #26',sub:'SAQUON BARKLEY'});
tv.card('air',{head:'TUBE MEN · BUILD',value:'100% AIR',sub:'ZERO FOOTBALL EXPERIENCE'});
tv.card('prob',{head:'WIN PROBABILITY',value:'PHI 99%',sub:'EASIEST WIN OF THE SEASON?'});
tv.card('r06',{head:'EAGLES · LAST 6 GAMES',value:'0–6',headColor:'#E0405A'}).style.top='330px';
tv.tag('replay','▶ REPLAY');
tv.card('yds',{head:'BARKLEY RUSH',value:'2 YARDS',sub:'INTO A TUBE MAN'});
tv.card('sackT',{head:'SACKS ON McKEE',value:'1',headColor:'#E0405A'});
tv.card('nogood',{head:'FIELD GOAL · ELLIOTT',value:'NO GOOD',sub:'OFF THE UPRIGHT',headColor:'#E0405A'});
tv.card('fin',{head:'FINAL',rows:[['TUBE MEN','27'],['EAGLES','10']]});
tv.card('kick',{head:'ONE TUBE MAN vs THE EAGLES',value:'12 – 10',sub:'4 FIELD GOALS'});
tv.card('next',{head:'NEXT WEEK',value:'vs GIANTS'});
tv.card('wave',{head:'TUBE MEN',value:'STILL WAVING'});
// Thẻ nằm top 330 khi KHÔNG có bug (tránh che đầu nhân vật ở trung cảnh), top 500 khi có bug (như mẫu).
// s7 "2012" và s9 "0 điểm" đã có trên biển 3D trong cảnh → không lặp thẻ 2D.
for(const id of ['title','saq','air','prob','fin','kick','next','wave'])tv.items[id].style.top='330px';
const TL=[['title',SH.s2[0],SH.s2[1]],['saq',...SH.s3],['air',...SH.s4],['prob',...SH.s5],['r06',SH.s6[0]+0.3,SH.s6[1]],
 ['replay',SUB.s10[0],SUB.s10[1]],['yds',SUB.s10[1],SH.s10[1]],['sackT',...SH.s12],['nogood',SUB.s13,SH.s13[1]],
 ['fin',...SH.s15],['kick',...SH.s16],['next',...SH.s17],['wave',...SH.s18]];
// lóa trắng: cú xoay, khai cuộc, replay, cú sút, kết quả, phần kết
const FL=[SH.s6[0],SH.s8[0],{t:SUB.s10[0],kind:'replay'},SH.s13[0],SH.s15[0],SH.s17[0]];
const SKB=[SH.s12[0],...SUB.s12];
const clock=(sec)=>{sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;};
document.fonts.ready.then(()=>{window.ready=true});
window.renderFrame=t=>{
  tv.show(t,TL);
  const bugOn=t<SH.s2[0]||(t>=SH.s8[0]&&t<SH.s9[0])||(t>=SH.s10[0]&&t<SH.s15[0]&&!(t>=SUB.s10[0]&&t<SUB.s10[1]));
  const a=t<SUB.s8+1.6?0:t<SH.s9[0]?7:10;let b=0;if(t>=SH.s14[0])b=Math.min(27,Math.floor((t-SH.s14[0])/(SH.s14[1]-SH.s14[0])*10)*3);if(t>=SH.s14[1])b=27;
  const q=t<SH.s10[0]?'1ST':t<SH.s13[0]?'3RD':'4TH';
  const ck=t<SH.s8[0]?'15:00':t<SH.s10[0]?clock(900-(t-SH.s8[0])*6):t<SH.s13[0]?clock(581-(t-SH.s10[0])*4):clock(125-(t-SH.s13[0])*8);
  const down=t>=SH.s11[0]&&t<SH.s13[0]?['1ST & 10','2ND & 18','3RD & 25','4TH & 31','4TH & 38'][Math.max(0,SKB.filter(x=>t>=x).length-1)]:null;
  tv.setBug({on:bugOn,a,b,q,clock:ck,down});
  const n=SKB.filter(x=>t>=x+0.15).length;
  const sk=[...document.querySelectorAll('.tv-card')].find(e=>e.textContent.includes('SACKS ON'));if(sk)sk.querySelector('.v').textContent=String(Math.max(1,n));
  tv.flash(t,FL);
};
</script></body></html>
