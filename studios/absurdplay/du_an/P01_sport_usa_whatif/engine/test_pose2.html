<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c"></canvas>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {buildArena,arenaLights,basketball,rimWorld} from './lib/nba.js';
import {loadLibrary} from './lib/nhanvat2.js';
import {CAST} from './lib/cast2.js';
import * as BR from './lib/bongro.js';
await Promise.all(['100px Anton','900 60px Inter'].map(f=>document.fonts.load(f)));
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(W,H,false);
r.shadowMap.enabled=true;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.NeutralToneMapping;r.toneMappingExposure=1.08;
const s=new THREE.Scene();const A=buildArena(s);arenaLights(s);
const lib=await loadLibrary();const G=CAST.giannis(lib);s.add(G.root);const ball=basketball();s.add(ball);
const F=CAST.fan34(lib);s.add(F.root);const RF=CAST.ref(lib);s.add(RF.root);
const cam=new THREE.PerspectiveCamera(45,W/H,.05,300);
const rim=rimWorld(A.hoops[0]);
window.renderFrame=t=>{const m=location.hash.slice(1);let bp,look=[0,1.1,0],cp=[2.2,1.4,3.2];F.root.visible=RF.root.visible=false;G.root.rotation.y=0;
  if(m==='dribble'){bp=BR.dribble(G,0.15,0,0);}
  if(m==='wing'){BR.wingspan(G,1,0,0);bp=new THREE.Vector3(0,-1,0);cp=[0,1.5,4.5];}
  if(m==='shoot'){bp=BR.shoot(G,0.7,0,0);look=[0,1.6,0];}
  if(m==='chest'){bp=BR.holdChest(G,0,0);}
  if(m==='flex'){BR.flex(G,1,0,0,0);bp=new THREE.Vector3(0,-1,0);cp=[0.5,1.6,3.5];}
  if(m.startsWith('dunk')){const k=+m.slice(4);G.root.rotation.y=Math.PI/2;bp=BR.dunk(G,k,new THREE.Vector3(rim.x-4,0,0.5),rim);look=[rim.x-0.6,2.4,0];cp=[rim.x-2.5,2.2,4.5];}
  if(m==='fan'){G.root.visible=false;F.root.visible=true;F.root.rotation.y=Math.PI;BR.seated(F,0,0,0.5,1,0,1.3);bp=new THREE.Vector3(0,-1,0);cp=[0.4,1.2,-2.4];look=[0,0.9,0];}
  if(m==='ref'){G.root.visible=false;RF.root.visible=true;BR.toss(RF,0.8,0,0);bp=new THREE.Vector3(0,-1,0);}
  ball.position.copy(bp);cam.position.set(...cp);cam.lookAt(...look);r.render(s,cam);};
window.ready=true;
</script></body></html>
