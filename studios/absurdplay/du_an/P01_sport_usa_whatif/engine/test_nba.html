<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c"></canvas>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {buildArena,arenaLights,basketball,mvpTrophy,pickEnvelope,rimWorld} from './lib/nba.js';
import {loadLibrary,makeCharacter} from './lib/nhanvat2.js';
import {CAST} from './lib/cast2.js';
await Promise.all(['100px Anton','900 60px Inter'].map(f=>document.fonts.load(f)));
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(W,H,false);

const s=new THREE.Scene();const A=buildArena(s);arenaLights(s);

const G=CAST.giannis(lib);G.root.position.set(0,0,0);G.root.rotation.y=0.3;s.add(G.root);
const HR=CAST.herro(lib);HR.root.position.set(1.2,0,0.3);HR.root.rotation.y=-0.4;s.add(HR.root);

const F=CAST.fan34(lib);F.root.position.set(2.4,0,0.4);F.root.rotation.y=Math.PI+0.3;s.add(F.root);
for(const ch of [G,HR,B1,F]){ch.play('Idle_No_Loop');ch.mixer.setTime(0.5);}
const ball=basketball();ball.position.set(0.55,1.0,0.6);s.add(ball);
const t1=mvpTrophy();t1.position.set(-0.6,0,1.0);s.add(t1);const pk=pickEnvelope();pk.position.set(-0.2,0.1,1.2);pk.rotation.x=-1.2;s.add(pk);
const cam=new THREE.PerspectiveCamera(45,W/H,.05,300);
const V={front:[[0.6,1.4,4.2],[0.6,1.2,0]],back:[[0.6,1.5,-4.0],[0.6,1.2,0]],face:[[0.15,1.95,1.2],[0,2.0,0]],ball:[[0.75,1.15,1.1],[0.55,1.0,0.6]],wide:[[0,5,16],[0,1.5,0]],hoop:[[9,2.6,3],[13,3.0,0]],jumbo:[[0,6,9],[0,11,0]]};
window.renderFrame=t=>{const v=V[location.hash.slice(1).split('&')[0]||'front'];cam.position.set(...v[0]);cam.lookAt(...v[1]);ball.rotation.y=t;r.render(s,cam);};
window.ready=true;
</script></body></html>
