<!doctype html><html><body style="margin:0"><canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","postprocessing":"./node_modules/postprocessing/build/index.js","realism-effects":"./node_modules/realism-effects/dist/index.js"}}</script>
<script type="module">
import * as THREE from 'three';import {EffectComposer,RenderPass,EffectPass,ToneMappingEffect,ToneMappingMode} from 'postprocessing';import {loadLibrary,makeCharacter} from './lib/nhanvat2.js';import {VelocityDepthNormalPass,MotionBlurEffect} from 'realism-effects';
import {buildStadium,stadiumLights} from './lib/svd.js';
const r=new THREE.WebGLRenderer({canvas:c,antialias:false,preserveDrawingBuffer:true});r.setSize(1080,1920,false);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.NeutralToneMapping;

window.renderFrame=t=>{pose(t-1/30);if(useMB)comp.render(1/30);pose(t);if(useMB)comp.render(1/30);else r.render(s,cam);};window.ready=true;
</script></body></html>
