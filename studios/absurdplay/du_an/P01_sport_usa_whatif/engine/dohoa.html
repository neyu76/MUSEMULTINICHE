<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}
@font-face{font-family:Silk;font-weight:700;src:url(fonts/silkscreen-latin-700-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter}
.bug{position:absolute;top:118px;left:50%;transform:translateX(-50%);display:flex;height:72px;font-weight:900;color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bug div{display:flex;align-items:center;padding:0 22px}.t1{background:#0b2a5b;width:190px;justify-content:space-between}.t2{background:#e0457b;width:210px;justify-content:space-between}.clk{background:#141a2b;width:200px;justify-content:space-around}.dd{background:#f2c230;color:#141a2b;font-size:22px}
.sub{position:absolute;top:190px;left:50%;transform:translateX(-50%);background:#f2c230;color:#141a2b;font-size:15px;font-weight:900;padding:4px 18px;letter-spacing:1px;white-space:nowrap}
.card{position:absolute;top:330px;left:50%;transform:translateX(-50%);width:820px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card .h{background:#f2c230;color:#141a2b;font-size:30px;font-weight:900;padding:8px;letter-spacing:2px}
.card .b{background:#141a2b;color:#fff;font-size:118px;font-weight:900;padding:14px 0 6px;line-height:1}
.card .s{background:#141a2b;color:#f2c230;font-size:30px;font-weight:900;padding:0 0 20px;letter-spacing:1px}
.w3d{position:absolute;top:560px;width:100%;text-align:center;font-family:Silk;font-size:96px;color:#f7e04a;-webkit-text-stroke:6px #1a1a1a;paint-order:stroke fill;letter-spacing:4px}
</style></head><body>
<div class="bug"><div class="t1"><span>DAL</span><span style="color:#f2c230">0</span></div><div class="t2"><span>BABIES</span><span style="color:#f2c230">0</span></div><div class="clk"><span>1ST</span><span>15:00</span></div><div class="dd">1ST &amp; 10</div></div>
<div class="sub">NFC WILD CARD · DEMO STADIUM</div>
<div class="card" id="card"><div class="h">WIN PROBABILITY</div><div class="b">DAL 99.9%</div><div class="s">EASIEST WIN IN HISTORY?</div></div>
<div class="w3d">PRO ATHLETES</div>
<script>document.fonts.ready.then(()=>{window.ready=true});window.renderFrame=t=>{const k=Math.min(1,t/0.2);document.getElementById('card').style.transform=`translateX(-50%) scale(${0.85+0.15*k})`;document.getElementById('card').style.opacity=k;}</script>
</body></html>
