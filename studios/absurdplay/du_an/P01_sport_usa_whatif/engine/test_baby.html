<!doctype html><html><body style="margin:0"><canvas id="c" width="1080" height="1920"></canvas>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {loadLibrary,makeCharacter,makeBaby} from './lib/nhanvat2.js';import {POSES} from './lib/tuthe.js';
await document.fonts.load('100px Anton');
const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(1080,1920,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;
const s=new THREE.Scene();s.background=new THREE.Color('#9fb6cf');s.add(new THREE.HemisphereLight('#f4f6ff','#4a6a3a',2.2));const sun=new THREE.DirectionalLight('#fff3e0',1.6);sun.position.set(3,8,6);sun.castShadow=true;s.add(sun);
const g=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#4a9a40'}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
const lib=await loadLibrary();
const babies=[];const mk=(x,pose,col,num,rot)=>{const b=makeBaby(lib,{skin:col,jersey:'#ff6fae',pants:'#ffffff',socks:'#ff6fae',number:num,numberColor:'#ffffff',numberOutline:'#c2185b',helmet:'#ffffff',mask:'#ff6fae'});b.root.position.set(x,0,0);b.root.rotation.y=rot;s.add(b.root);babies.push([b,pose]);};
mk(-0.55,'sit','#c58c62',12,0.3);mk(0.1,'crawl','#8a5a3c',23,-0.6);mk(0.65,'sit','#e8c1a0',1,-0.3);
const A=makeCharacter(lib,{skin:'#7b4b2e',jersey:'#f4f4f4',pants:'#aeb4bf',socks:'#0b2a5b',number:4,helmet:'#c3c8d0',mask:'#0b2a5b'});A.root.position.set(-0.2,0,-1.6);s.add(A.root);A.play('Idle_FoldArms_Loop');
const cam=new THREE.PerspectiveCamera(35,1080/1920,.1,100);
window.renderFrame=t=>{A.mixer.setTime(t);for(const [b,p] of babies){b.root.updateMatrixWorld(true);POSES[p](b,t);}
 if(location.hash==='#close'){cam.position.set(-0.35,0.75,1.5);cam.lookAt(-0.45,0.45,0);}else{cam.position.set(0,1.0,3.6);cam.lookAt(0,0.6,0);}r.render(s,cam)};window.ready=true;
</script></body></html>
