<!doctype html><html><body style="margin:0"><canvas id="c" width="1080" height="1920"></canvas>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {buildStadium,stadiumLights} from './lib/svd.js';import {loadLibrary,makeCharacter,makeBaby} from './lib/nhanvat2.js';import {POSES,groundIt} from './lib/tuthe.js';
await Promise.all(['100px Anton','900 60px Inter','700 60px Oswald'].map(f=>document.fonts.load(f)));
const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(1080,1920,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
const s=new THREE.Scene();const st=buildStadium(s);stadiumLights(s);
const lib=await loadLibrary();
const A=makeCharacter(lib,{skin:'#7b4b2e',jersey:'#f4f4f4',pants:'#aeb4bf',socks:'#0b2a5b',number:4,helmet:'#c3c8d0',mask:'#0b2a5b'});A.root.position.set(-1.2,0,2);A.root.rotation.y=0.3;s.add(A.root);A.play('Idle_FoldArms_Loop');
const B=makeCharacter(lib,{skin:'#e0b48e',jersey:'#f4f4f4',pants:'#aeb4bf',socks:'#0b2a5b',number:88,helmet:'#c3c8d0',mask:'#0b2a5b'});B.root.position.set(0.4,0,1.2);B.root.rotation.y=-0.4;s.add(B.root);B.play('Idle_TalkingPhone_Loop');
const bs=[];for(let i=0;i<12;i++){const b=makeBaby(lib,{skin:['#c58c62','#8a5a3c','#e8c1a0'][i%3],jersey:'#ff6fae',pants:'#fff',socks:'#ff6fae',number:[1,12,23,7,5,9,3,17,21,8,2,4][i],numberColor:'#fff',numberOutline:'#c2185b',helmet:'#ffffff',mask:'#ff6fae'});b.root.position.set(-3+((i*2.3)%8),0,-3-((i*1.7)%9));b.root.rotation.y=Math.PI+((i*0.9)%2-1);s.add(b.root);bs.push([b,['sit','crawl','sit','lie'][i%4]]);}
const cam=new THREE.PerspectiveCamera(40,1080/1920,.1,500);
window.renderFrame=t=>{A.mixer.setTime(t);B.mixer.setTime(t);for(const[b,p] of bs){POSES[p](b,t);groundIt(b,0,0.03);}st.ledTex.offset.x=-t*0.05;
 if(location.hash==='#wide'){cam.position.set(14,9,22);cam.lookAt(0,1.5,-6);}else{cam.position.set(-0.2,1.6,7);cam.lookAt(-0.2,1.3,0);}r.render(s,cam)};window.ready=true;
</script></body></html>
